app-id: io.emeric.toolblex
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk

command: toolBLEx
rename-desktop-file: toolBLEx.desktop
rename-appdata-file: toolBLEx.appdata.xml
rename-icon: toolBLEx

finish-args:
  # Our UI is GPU accelerated
  - --device=dri
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # We need Bluetooth support
  - --share=network
  - --allow=bluetooth
  - --system-talk-name=org.bluez

cleanup:
  - /bin/__pypache__
  - /bin/rst*
  - /include
  - /lib/cmake
  - /lib/cups
  - /lib/pkgconfig
  - /lib/python*
  - /share/doc
  - /share/man
  - /share/zsh
  - /src
  - '*.a'
  - '*.la'

modules:
  - name: toolBLEx
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/emericg/toolBLEx/archive/refs/tags/v0.14.1.tar.gz
        sha256: 49bd4a8f861cb64ad9c7874ed359e35bcbbf45e394d017f098491bb181032d34
